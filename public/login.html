<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>登录 - NXC Report</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <script src="/js/theme-boot.js"></script>
  <script src="/js/i18n.js?v=20261107rotate1"></script>
  <link rel="stylesheet" href="/css/style.css?v=20261107rotate1">
  <link rel="stylesheet" href="/css/login.css?v=20261107rotate1">
</head>
<body class="lg-body">
  <canvas id="lg-bg" class="lg-bg" aria-hidden="true"></canvas>

  <div class="lg-tools">
    <button type="button" class="lg-tool" id="lang-toggle" translate="no" aria-label="切换语言" title="切换语言">
      <i data-lucide="languages"></i>
      <span data-lang-choice="zh">中</span><span data-lang-choice="en">EN</span>
    </button>
    <button type="button" class="lg-tool" id="lg-theme" aria-label="切换主题" title="切换主题">
      <span class="lg-theme-dark"><i data-lucide="moon"></i></span>
      <span class="lg-theme-light"><i data-lucide="sun"></i></span>
    </button>
  </div>

  <main class="lg-page">
    <div class="lg-dial" id="lg-dial">
      <canvas id="lg-dial-canvas" class="lg-dial-canvas" aria-hidden="true"></canvas>
      <div class="lg-dial-core">
        <!-- Single-ink NXC Report wordmark: slanted NXC, orbit with a travelling point, spaced REPORT. -->
        <svg class="lg-wordmark" id="lg-wordmark" viewBox="0 0 336 72" role="img" aria-label="NXC Report">
          <g transform="skewX(-14) translate(14 0)" fill="currentColor">
            <path d="M0 6h17l31 37V6h17v60H48L17 29v37H0z"/>
            <path d="M72 6h20l13 18 13-18h20l-23 30 23 30h-20l-13-18-13 18H72l23-30z"/>
            <path d="M200 6h-34c-18 0-26 10-26 30s8 30 26 30h34V50h-31c-8 0-12-4-12-14s4-14 12-14h31z"/>
          </g>
          <g transform="rotate(-17 108 38)">
            <ellipse class="lg-wm-orbit" cx="108" cy="38" rx="84" ry="19" fill="none" stroke-width="2.2"/>
            <circle class="lg-wm-dot" r="4.6">
              <animateMotion dur="6s" repeatCount="indefinite" path="M24,38 a84,19 0 1,1 168,0 a84,19 0 1,1 -168,0"/>
            </circle>
            <circle class="lg-wm-dot lg-wm-dot-sm" r="2.8">
              <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M24,38 a84,19 0 1,1 168,0 a84,19 0 1,1 -168,0"/>
            </circle>
          </g>
          <text x="216" y="64" class="lg-wm-report">REPORT</text>
        </svg>
        <h1 class="lg-title">多公司资金对账后台</h1>
      </div>
    </div>

    <form id="login-form" class="lg-form" novalidate aria-labelledby="lg-form-title">
      <h2 id="lg-form-title" class="lg-visually-hidden">登录</h2>
      <div class="lg-field">
        <label for="username">账号 ID</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="lg-field">
        <label for="password">密码</label>
        <div class="password-field">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle icon-btn" id="password-toggle" aria-label="显示密码" aria-pressed="false">
            <i data-lucide="eye"></i>
            <span class="icon-fallback" aria-hidden="true">Show</span>
          </button>
        </div>
      </div>
      <div id="error" class="error-msg lg-error" role="alert" aria-live="assertive" hidden></div>
      <button type="submit" class="lg-submit login-submit" id="login-submit">
        <span class="btn-label">登录</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
    </form>

    <footer class="lg-foot">
      <span>数据与支付操作按公司隔离</span>
      <span translate="no">© 2026 NXC Report</span>
    </footer>
  </main>

  <!-- 点「登录」后弹出的旋转验证：拖滑块把手指转到朝上，松手即提交。 -->
  <div class="lg-captcha-overlay" id="captcha-modal" aria-hidden="true">
    <div class="lg-captcha" role="dialog" aria-modal="true" aria-labelledby="captcha-title" aria-describedby="captcha-hint">
      <button type="button" class="lg-captcha-close" id="captcha-close" aria-label="关闭">
        <i data-lucide="x"></i>
        <span class="icon-fallback" aria-hidden="true">×</span>
      </button>
      <h2 id="captcha-title" class="lg-captcha-title">安全验证</h2>
      <p id="captcha-hint" class="lg-captcha-hint">拖动滑块，让手指朝上</p>
      <div class="lg-captcha-stage" id="captcha-stage">
        <img id="captcha-img" alt="" draggable="false" width="200" height="200">
        <span class="lg-captcha-spinner" aria-hidden="true"></span>
      </div>
      <div class="lg-captcha-track" id="captcha-track">
        <div class="lg-captcha-fill" id="captcha-fill"></div>
        <span class="lg-captcha-track-label" aria-hidden="true">向右拖动</span>
        <button type="button" class="lg-captcha-thumb" id="captcha-thumb" role="slider" aria-label="旋转角度" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
          <i data-lucide="chevrons-right"></i>
          <span class="icon-fallback" aria-hidden="true">»</span>
        </button>
      </div>
      <button type="button" class="lg-captcha-refresh" id="captcha-refresh">
        <i data-lucide="rotate-cw"></i>
        <span>换一张</span>
      </button>
    </div>
  </div>

  <script src="/js/login-boot.js"></script>
  <script src="/vendor/lucide-1.65.0.min.js"></script>
  <script src="/js/login-dial.js?v=20261107rotate1"></script>
  <script src="/js/login.js?v=20261107rotate1"></script>
</body>
</html>
