<body class="login-body">
  <main class="login-page">
    <section class="login-box glass-panel" aria-labelledby="login-title">
      <img class="login-brand" src="/brand/nxc-icon.png" alt="" width="56" height="56">
      <div class="login-heading">
        <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
          <button type="button" class="lang-toggle" id="lang-toggle" translate="no" aria-label="&#20999;&#25442;&#35821;&#35328;" title="&#20999;&#25442;&#35821;&#35328;"><span data-lang-choice="zh">&#20013;</span><span data-lang-choice="en">EN</span></button>
        </div>
        <p class="login-kicker">Command Center</p>
        <h1 id="login-title">NXC Report</h1>
        <p>&#20351;&#29992;&#24050;&#20998;&#37197;&#30340;&#36134;&#21495;&#23433;&#20840;&#30331;&#24405;</p>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">&#36134;&#21495; ID</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="password">&#23494;&#30721;</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle icon-btn" id="password-toggle" aria-label="&#26174;&#31034;&#23494;&#30721;" aria-pressed="false">
              <i data-lucide="eye"></i>
              <span class="icon-fallback" aria-hidden="true">Show</span>

          </div>
        </div>
        <div id="error" class="error-msg" role="alert" aria-live="assertive" hidden></div>
        <button type="submit" class="btn btn-primary login-submit" id="login-submit">
          <span class="btn-label">&#30331;&#24405;</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>
      <p class="login-footnote">&#25968;&#25454;&#19982;&#25903;&#20184;&#25805;&#20316;&#25353;&#20844;&#21496;&#38548;&#31163;</p>
    </section>
